name: Collect and deploy

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # Redeploy right after the weekly (or manual) backfill finishes
  workflow_run:
    workflows: ["Backfill history"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "sources.yaml"
      - "config/**"
      - "secblog/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A push-triggered run can sit queued behind another run (concurrency
          # group); start from the latest main, not the triggering commit.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect feeds
        run: python -m secblog collect --concurrency 16

      - name: Collect GitHub tools metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m secblog tools
        continue-on-error: true

      - name: Persist data
        env:
          # GITHUB_TOKEN is provided by Actions; script pushes with rebase retries
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: 'bash tools/ci_commit_data.sh "chore: collect feeds"'

      - name: Build site
        run: python -m secblog build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
