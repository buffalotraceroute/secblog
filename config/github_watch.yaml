curated_lists:
- id: awesome-bof
  repo: chryzsh/awesome-bof
  paths:
  - BOF-CATALOG.md
  - README.md
  source_label: curated:awesome-bof
  default_categories:
  - BOFs
  add_owners_to_watch: true
  skip_sections:
  - Not on Github
  - Supporting Tools
- id: cs-community-kit
  repo: Cobalt-Strike/community_kit
  paths:
  - tracked_repos.txt
  - data.json
  format: community_kit
  source_label: curated:cs-community-kit
  add_owners_to_watch: true
  category_map:
    BOF:
    - BOFs
    Aggressor:
    - C2 Frameworks & Agents
    UDRL:
    - Loaders & Injection
    RDLL:
    - Loaders & Injection
    Malleable-C2:
    - C2 Frameworks & Agents
    UDC2:
    - C2 Frameworks & Agents
    External-C2:
    - C2 Frameworks & Agents
    REST API:
    - C2 Frameworks & Agents
    Kit:
    - C2 Frameworks & Agents
    Infrastructure:
    - Other
    Logging:
    - Other
    Reports:
    - Other
lure_patterns:
- \bfree\s+crack\b
- \bcheat\b
- \bstealer\s+download\b
- \bkeylogger\s+download\b
- \b(hack|cheat)\s+(fortnite|valorant|roblox|warzone)\b
- \brat\s+download\b
- \bcracked\s+(spotify|netflix|adobe)\b
- \bfree\s+nitro\b
