categories:
- BOFs
- Loaders & Injection
- Evasion (EDR/AV/AMSI/ETW)
- Lateral Movement
- Credential Access
- Active Directory
- C2 Frameworks & Agents
- Persistence
- Privilege Escalation
- Recon
- Cloud
- Other
discovery:
  min_stars: 5
  lookback_days: 14
  seed_lookback_days: 270
  max_queries_per_run: 12
  queries:
  - topic:bof
  - topic:beacon-object-file
  - cobalt-strike BOF in:name,description
  - shellcode loader in:name,description
  - process injection in:name,description
  - lateral movement in:name,description
  - edr evasion OR edr-bypass in:name,description
  - amsi bypass OR etw bypass in:name,description
  - topic:red-team
  - topic:redteam
  - topic:c2
  - topic:post-exploitation
  - coff-loader OR reflective-dll OR sleep-obfuscation in:name,description
  - kerberoast OR asreproast OR nanodump in:name,description
  - direct syscalls OR indirect syscalls in:name,description
