{% extends "base.html" %}
{% block content %}
<header class="page-head"><h1>Blogs</h1><p>{{ sources|length }} sources</p></header>
<ul class="blog-list">
  {% for s in sources %}
  <li>
    <a href="{{ base }}/blog/{{ s.id }}/">{{ s.name }}</a>
    <span class="status status-{{ s.status }}">{{ status_labels.get(s.status, s.status) }}</span>
    <span class="count">{{ counts.get(s.id, 0) }}</span>
  </li>
  {% endfor %}
</ul>
{% endblock %}
